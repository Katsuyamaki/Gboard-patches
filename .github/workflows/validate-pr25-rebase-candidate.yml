name: Validate PR25 4.1.1 rebase candidate

on:
  push:
    branches:
      - review/pr25-upstream-4.1.1-candidate

permissions:
  contents: read
  packages: read

jobs:
  cover-resize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact pushed source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Run upstream tests and compile patch bundle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test :patches:buildAndroid :patches:generatePatchesList
      - name: Assert 18.0.3-only native hook stays guarded on 18.5.4
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = Path('patches/src/main/kotlin/dev/jason/gboardpatches/patches/gboard/registry/GboardPatchRegistry.kt').read_text()
          assert 'GboardTargetAdmission.versionNames == listOf("18.0.3.954559732-release-arm64-v8a")' in registry
          assert Path('patches/src/main/kotlin/dev/jason/gboardpatches/patches/gboard/features/modevariant/GboardCoverResizeSelectorHook.kt').is_file()
          published = json.loads(Path('patches-list.json').read_text())['patches']
          assert not any(p['name'] == 'Independent cover/main Resize profiles' for p in published)
          print('PASS: 18.0.3 native implementation retained; 18.5.4 patch not exposed')
          PY
